name: Release

# Publishes @agenticcli/shipguard to npm with provenance, from a version tag (vX.Y.Z).
# Auth is npm trusted publishing (OIDC): there is NO npm token anywhere in this workflow.
# One-time npm setup: package Settings > Trusted publisher > GitHub Actions >
#   owner agenticcli, repository shipguard, workflow release.yml, environment npm-publish.
#
# Three jobs, so that no dependency code ever runs in a job that can publish or write releases:
#   build   - contents: read only, NO id-token. Installs (lifecycle scripts blocked), builds, tests,
#             packs, uploads the tarball + its sha256. This is the only job that runs dependency code.
#   publish - id-token: write, environment npm-publish. NO checkout, NO install, NO cache. Downloads the
#             tarball, checks its sha256 against the build job output, then publishes that tarball.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, gate, pack
    runs-on: ubuntu-latest   # GitHub-hosted runner
    timeout-minutes: 30
    permissions:
      contents: read         # no id-token, no secrets: this job runs dependency code
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Checkout (full history, to prove the tag is on main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag commit must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: '9.15.0'

      # No `cache: pnpm`: a release build never restores a shared cache.
      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - name: Tag must equal the package version
        run: |
          ver="$(node -p "require('./packages/cli/package.json').version")"
          test "v$ver" = "$GITHUB_REF_NAME" \
            || { echo "::error::tag $GITHUB_REF_NAME != package.json version v$ver"; exit 1; }

      # pnpm 9 runs dependency lifecycle scripts by default; --ignore-scripts blocks them.
      # Nothing in the lockfile needs a build script (esbuild ships prebuilt platform binaries
      # as optional deps); if the build below ever fails for lack of one, add it deliberately.
      - name: Install workspace deps (lifecycle scripts blocked)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build, lint, test
        run: |
          pnpm run build
          pnpm run lint
          pnpm test

      - name: Publish build + release gate
        run: |
          pnpm --filter @agenticcli/shipguard run build:publish
          bash scripts/release-gate.sh

      - name: Pack with pnpm and check the tarball
        id: pack
        working-directory: packages/cli
        run: |
          out="$RUNNER_TEMP/tarball"
          mkdir -p "$out"
          pnpm pack --pack-destination "$out"
          test "$(ls "$out" | wc -l)" = 1
          tgz="$(ls "$out"/agenticcli-shipguard-*.tgz)"
          tar -tzf "$tgz"
          tar -xzOf "$tgz" package/package.json | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              const p=JSON.parse(d);
              if(!p.bin||!p.bin.shipguard){console.error('tarball lost bin.shipguard');process.exit(1)}
              if(p.repository.url!=='git+https://github.com/agenticcli/shipguard.git'){console.error('repository.url mismatch');process.exit(1)}
              if(JSON.stringify(p).includes('workspace:')){console.error('workspace: protocol left in tarball');process.exit(1)}
            })"
          sha="$(sha256sum "$tgz" | cut -d' ' -f1)"
          name="$(basename "$tgz")"
          echo "$sha  $name" > "$out/$name.sha256"
          echo "tarball=$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "packed $name sha256 $sha"

      - name: Upload tarball + sha256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: shipguard-tarball
          path: ${{ runner.temp }}/tarball/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify tarball, publish with provenance
    needs: build
    runs-on: ubuntu-latest   # GitHub-hosted runner: required by npm trusted publishing + provenance
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      id-token: write        # OIDC token for npm trusted publishing + provenance signing; nothing else
    steps:
      # No checkout, no pnpm, no install, no cache: no repository or dependency code runs in this job.
      - name: Download tarball + sha256
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: shipguard-tarball
          path: ${{ runner.temp }}/tarball

      # setup-node has no registry-url: with it, setup-node writes an .npmrc and sets a placeholder
      # NODE_AUTH_TOKEN; we do not need it (no private deps), so it is dropped and NODE_AUTH_TOKEN is
      # unset below to keep the publish on the OIDC trusted-publisher path only.
      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - name: npm must be >= 11.5.1 (trusted publishing floor)
        run: |
          v="$(npm --version)"; echo "node $(node --version) npm $v"
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit((a>11||(a===11&&(b>5||(b===5&&c>=1))))?0:1)" "$v" \
            || { echo "::error::npm $v is older than 11.5.1"; exit 1; }

      - name: Verify tarball against the build job's sha256
        working-directory: ${{ runner.temp }}/tarball
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          case "$TARBALL" in
            agenticcli-shipguard-*.tgz) ;;
            *) echo "::error::unexpected tarball name"; exit 1 ;;
          esac
          case "$EXPECTED_SHA256" in
            *[!0-9a-f]*|"") echo "::error::bad expected sha256"; exit 1 ;;
          esac
          test "${#EXPECTED_SHA256}" = 64 || { echo "::error::bad expected sha256 length"; exit 1; }
          # exact file set, dotfiles included (a planted .npmrc would be read by npm publish)
          test "$(ls -A | LC_ALL=C sort)" = "$(printf '%s\n%s' "$TARBALL" "$TARBALL.sha256" | LC_ALL=C sort)" \
            || { echo "::error::artifact must hold exactly the tarball and its .sha256"; ls -A; exit 1; }
          echo "$EXPECTED_SHA256  $TARBALL" | sha256sum --check --strict -
          sha256sum --check --strict "$TARBALL.sha256"
          ver="$(tar -xzOf "$TARBALL" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          test "v$ver" = "$GITHUB_REF_NAME" \
            || { echo "::error::tag $GITHUB_REF_NAME != tarball version v$ver"; exit 1; }

      # Docs: https://docs.npmjs.com/trusted-publishers
      - name: Publish to npm with provenance
        working-directory: ${{ runner.temp }}/tarball
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) tag=next ;;     # a prerelease can never take the latest tag
            *)   tag=latest ;;
          esac
          unset NODE_AUTH_TOKEN
          npm publish "./$TARBALL" --provenance --access public --tag "$tag" --ignore-scripts --registry=https://registry.npmjs.org/

  # Creates the GitHub Release for the tag, after npm has accepted the publish. Only job with
  # contents: write. Checks out the tag for CHANGELOG.md only; no install and no dependency code runs.
  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create the release; no id-token here
    steps:
      - name: Checkout the tag (CHANGELOG only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Create the release (prerelease for tags with "-")
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          base="${TAG#v}"; base="${base%%-*}"
          # notes = the CHANGELOG section whose heading starts with the base version (e.g. "## 0.10.0 - ...")
          awk -v b="$base" '
            /^## / { if (on) exit; if (index($0, "## " b " ") == 1 || $0 == "## " b) { on = 1; next } }
            on { print }
          ' packages/cli/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            flags+=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            echo "::warning::no CHANGELOG section for $base; using generated notes"
            flags+=(--generate-notes)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" "${flags[@]}"
