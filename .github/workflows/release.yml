name: Release

# Publishes @agenticcli/shipguard to npm with provenance, from a version tag (vX.Y.Z).
# Auth is npm trusted publishing (OIDC): there is NO npm token anywhere in this workflow.
# One-time npm setup: package Settings > Trusted publisher > GitHub Actions >
#   owner agenticcli, repository shipguard, workflow release.yml, environment npm-publish.
#
# A release tag is only ever created by release-tag.yml, and only on a commit whose real release gate already
# passed (release-preflight.yml). The first job here re-checks that and fails fast, before anything else, so a
# tag pushed by hand on an unproven commit cannot publish. See RELEASING.md.
#
# Five jobs, so that no dependency code ever runs in a job that can publish or write releases:
#   verify-preflight - actions: read + contents: read. Fails unless release-preflight passed for this exact SHA.
#   build   - contents: read only, NO id-token. Installs (lifecycle scripts blocked), builds, tests,
#             packs, uploads the tarball + its sha256. This is the only job that runs dependency code.
#   publish - id-token: write, environment npm-publish. NO checkout, NO install, NO cache. Downloads the
#             tarball, checks its sha256 against the build job output, then publishes that tarball.
#   github-release - contents: write only, runs after publish. Creates the GitHub Release for the tag.
#   release-facts  - contents: read only, runs after publish. Checks the registry against the built tarball and
#             emits release-facts.json. Verify + emit only: no secret, no write.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # release-tag.yml dispatches this workflow on the tag it just created: a tag pushed with the workflow token
  # does not trigger the push event above (GitHub rule), a dispatch does. Must be run on a tag ref (checked below).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-preflight:
    name: Release gate already passed for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read          # list workflow runs; nothing else
    steps:
      - name: Must run on a release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          [ "$REF_TYPE" = tag ] || { echo "::error::release.yml runs on a release tag only, not on $REF_TYPE $REF_NAME"; exit 1; }
          printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::$REF_NAME is not a release tag name"; exit 1; }

      - name: Checkout (the preflight check script only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight must have passed for this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-preflight.sh "$GITHUB_SHA"

  build:
    name: Build, gate, pack
    needs: verify-preflight
    runs-on: ubuntu-latest   # GitHub-hosted runner
    timeout-minutes: 30
    permissions:
      contents: read         # no id-token, no secrets: this job runs dependency code
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Checkout (full history, to prove the tag is on main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag commit must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }

      # The same composite action release-preflight.yml ran before the tag was allowed to exist: install,
      # build, lint, test, release gate (real mode), pack. One definition, so the two cannot drift apart.
      - name: Build, gate, pack (shared with release-preflight)
        id: pack
        uses: ./.github/actions/release-build
        with:
          tag: ${{ github.ref_name }}

      - name: Upload tarball + sha256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: shipguard-tarball
          path: ${{ steps.pack.outputs.pack-dir }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify tarball, publish with provenance
    needs: build
    runs-on: ubuntu-latest   # GitHub-hosted runner: required by npm trusted publishing + provenance
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      id-token: write        # OIDC token for npm trusted publishing + provenance signing; nothing else
    steps:
      # No checkout, no pnpm, no install, no cache: no repository or dependency code runs in this job.
      - name: Download tarball + sha256
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: shipguard-tarball
          path: ${{ runner.temp }}/tarball

      # setup-node has no registry-url: with it, setup-node writes an .npmrc and sets a placeholder
      # NODE_AUTH_TOKEN; we do not need it (no private deps), so it is dropped and NODE_AUTH_TOKEN is
      # unset below to keep the publish on the OIDC trusted-publisher path only.
      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - name: npm must be >= 11.5.1 (trusted publishing floor)
        run: |
          v="$(npm --version)"; echo "node $(node --version) npm $v"
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit((a>11||(a===11&&(b>5||(b===5&&c>=1))))?0:1)" "$v" \
            || { echo "::error::npm $v is older than 11.5.1"; exit 1; }

      - name: Verify tarball against the build job's sha256
        working-directory: ${{ runner.temp }}/tarball
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          # exact basename: the tag names the version, so the tarball name is fully determined
          test "$TARBALL" = "agenticcli-shipguard-${GITHUB_REF_NAME#v}.tgz" \
            || { echo "::error::unexpected tarball name"; exit 1; }
          case "$EXPECTED_SHA256" in
            *[!0-9a-f]*|"") echo "::error::bad expected sha256"; exit 1 ;;
          esac
          test "${#EXPECTED_SHA256}" = 64 || { echo "::error::bad expected sha256 length"; exit 1; }
          # exact file set, dotfiles included (a planted .npmrc would be read by npm publish)
          test "$(ls -A | LC_ALL=C sort)" = "$(printf '%s\n%s' "$TARBALL" "$TARBALL.sha256" | LC_ALL=C sort)" \
            || { echo "::error::artifact must hold exactly the tarball and its .sha256"; ls -A; exit 1; }
          echo "$EXPECTED_SHA256  $TARBALL" | sha256sum --check --strict -
          sha256sum --check --strict "$TARBALL.sha256"
          ver="$(tar -xzOf "$TARBALL" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          test "v$ver" = "$GITHUB_REF_NAME" \
            || { echo "::error::tag $GITHUB_REF_NAME != tarball version v$ver"; exit 1; }

      # Docs: https://docs.npmjs.com/trusted-publishers
      # There is deliberately NO `npm dist-tag` step in this workflow. Trusted publishing (OIDC) cannot add or
      # remove a dist-tag unless the trusted publisher's "Allow npm dist-tag" option is enabled (same doc), and
      # we keep that option off. `npm publish --tag` below is the only tag this workflow sets (latest for a
      # release, next for a prerelease). Removing the stale `next` tag, if ever needed, is one owner-approved
      # command by the release session, not part of this workflow.
      - name: Publish to npm with provenance
        working-directory: ${{ runner.temp }}/tarball
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) tag=next ;;     # a prerelease can never take the latest tag
            *)   tag=latest ;;
          esac
          unset NODE_AUTH_TOKEN
          npm publish "./$TARBALL" --provenance --access public --tag "$tag" --ignore-scripts --registry=https://registry.npmjs.org/

  # Creates the GitHub Release for the tag, after npm has accepted the publish. Only job with
  # contents: write. Checks out the tag for CHANGELOG.md only; no install and no dependency code runs.
  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create the release; no id-token here
    steps:
      - name: Checkout the tag (CHANGELOG only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Create the release (prerelease for tags with "-")
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          base="${TAG#v}"; base="${base%%-*}"
          # notes = the CHANGELOG section whose heading starts with the base version (e.g. "## 0.10.0 - ...")
          awk -v b="$base" '
            /^## / { if (on) exit; if (index($0, "## " b " ") == 1 || $0 == "## " b) { on = 1; next } }
            on { print }
          ' packages/cli/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            flags+=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            echo "::warning::no CHANGELOG section for $base; using generated notes"
            flags+=(--generate-notes)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" "${flags[@]}"

  # W12: after the publish, prove the registry shows what the build job packed and emit release-facts.json
  # (version, dates, CHANGELOG entry, tarball size, provenance) as an artifact + job summary. Verify and emit
  # only: contents: read, no secret, no cross-repo write, no dist-tag change, no dependency code (no install).
  # The release session then opens the facts PR in agenticcli locally (never from here).
  release-facts:
    name: Verify registry, emit release facts
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout the tag (scripts/release-facts.sh and CHANGELOG only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - name: Download tarball + sha256
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: shipguard-tarball
          path: ${{ runner.temp }}/tarball

      - name: Verify registry and write release-facts.json
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          # exact basename: the tag names the version, so the tarball name is fully determined
          test "$TARBALL" = "agenticcli-shipguard-${GITHUB_REF_NAME#v}.tgz" \
            || { echo "::error::unexpected tarball name"; exit 1; }
          mkdir -p "$RUNNER_TEMP/release-facts"
          bash scripts/release-facts.sh emit --tag "$GITHUB_REF_NAME" \
            --tarball "$RUNNER_TEMP/tarball/$TARBALL" --out "$RUNNER_TEMP/release-facts/release-facts.json"

      - name: Upload release-facts.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-facts
          path: ${{ runner.temp }}/release-facts/release-facts.json
          if-no-files-found: error
          retention-days: 30
