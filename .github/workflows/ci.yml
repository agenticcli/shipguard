name: CI

# Minimal validation gate: install (frozen lockfile), build, lint, test.
# Runs on ready (non-draft) PRs and pushes to main. Draft PRs are skipped (no CI-failure emails). No secrets, no publish.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, lint, test
    # Null-safe on push: github.event.pull_request is absent there, so the draft test only applies to PRs.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # pnpm must exist before setup-node so `cache: pnpm` can resolve the store path.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          version: '9.15.0'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      # `pnpm test` runs matcher-contract (incl. the re2js-v1 freeze test) then the CLI suite.
      - name: Test
        run: pnpm test
