# Dependabot version updates: monthly, grouped (one PR per ecosystem), with a cooldown so a freshly
# published version (the usual window for a malicious release) is not proposed for a week.
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Security updates are separate: they come from the repo setting "Dependabot security updates" (must be
# switched on in Settings > Code security) and are NOT delayed by `cooldown` (version updates only).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"   # also covers the pnpm workspace + pnpm-lock.yaml
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns:
          - "*"
